<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Raleway, ui-sans-serif, system-ui, sans-serif">
  <rect width="1080" height="1350" fill="#54453A"/>

  <g opacity="0.08">
    <line x1="0" y1="200" x2="1080" y2="200" stroke="#D4A373" stroke-width="1"/>
    <line x1="0" y1="380" x2="1080" y2="380" stroke="#D4A373" stroke-width="1"/>
    <line x1="0" y1="960" x2="1080" y2="960" stroke="#D4A373" stroke-width="1"/>
    <line x1="0" y1="1160" x2="1080" y2="1160" stroke="#D4A373" stroke-width="1"/>
  </g>

  <g transform="translate(540,180)" text-anchor="middle">
    <text font-size="22" font-weight="700" fill="#D4A373" letter-spacing="6">THINK OUTSIDE</text>
  </g>

  <g transform="translate(540,620)" text-anchor="middle">
    <line x1="-80" y1="-110" x2="80" y2="-110" stroke="#D4A373" stroke-width="2"/>
    <text font-size="100" font-weight="700" fill="#FAF8F3">Passió per</text>
    <text y="120" font-size="100" font-weight="700" fill="#FAF8F3">una feina</text>
    <text y="240" font-size="100" font-weight="700" fill="#D4A373">ben feta.</text>
    <line x1="-80" y1="290" x2="80" y2="290" stroke="#D4A373" stroke-width="2"/>
  </g>

  <g transform="translate(540,1020)" text-anchor="middle" font-size="28" font-weight="400" fill="#EFE6DA">
    <text>A cada tall. A cada instal·lació.</text>
    <text y="44">A cada detall.</text>
  </g>

  <g transform="translate(540,1290)" text-anchor="middle" font-size="16" font-weight="500" fill="#EFE6DA" letter-spacing="3">
    <text>ESPECIALISTES EN INSTAL·LACIONS I MANTENIMENT DE FUSTA</text>
  </g>
</svg>

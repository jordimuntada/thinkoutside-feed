<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Raleway, ui-sans-serif, system-ui, sans-serif">
  <rect width="1080" height="1350" fill="#54453A"/>

  <g opacity="0.07">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#D4A373"/>
    </pattern>
    <rect width="1080" height="1350" fill="url(#dots)"/>
  </g>

  <g transform="translate(540,140)" text-anchor="middle">
    <text font-size="22" font-weight="700" fill="#D4A373" letter-spacing="6">THINK OUTSIDE</text>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#D4A373" stroke-width="2"/>
  </g>

  <g transform="translate(540,500)" text-anchor="middle">
    <text font-size="100" font-weight="700" fill="#FAF8F3">Tens un</text>
    <text y="120" font-size="100" font-weight="700" fill="#FAF8F3">projecte</text>
    <text y="240" font-size="100" font-weight="700" fill="#D4A373">en ment?</text>
  </g>

  <g transform="translate(540,920)" text-anchor="middle" font-size="26" font-weight="400" fill="#EFE6DA">
    <text>T'enviem un pressupost</text>
    <text y="40">sense compromís.</text>
  </g>

  <g transform="translate(540,1090)">
    <rect x="-200" y="-44" width="400" height="88" rx="8" fill="#D4A373"/>
    <text x="0" y="14" text-anchor="middle" font-size="26" font-weight="600" fill="#FFFFFF">Demana pressupost</text>
  </g>

  <g transform="translate(540,1210)" text-anchor="middle" font-size="18" font-weight="500" fill="#D4A373" letter-spacing="3">
    <text>↳ RESPONEM EN MENYS DE 24 H</text>
  </g>
</svg>

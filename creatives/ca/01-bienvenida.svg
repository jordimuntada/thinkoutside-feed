<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Raleway, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </linearGradient>
    <pattern id="wood" patternUnits="userSpaceOnUse" width="1080" height="60" patternTransform="rotate(-2)">
      <rect width="1080" height="60" fill="#54453A" opacity="0.04"/>
      <path d="M0 30 Q 270 18 540 30 T 1080 30" stroke="#54453A" stroke-width="1" fill="none" opacity="0.08"/>
      <path d="M0 50 Q 270 38 540 50 T 1080 50" stroke="#54453A" stroke-width="1" fill="none" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#wood)"/>

  <g transform="translate(60,80)">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#54453A" letter-spacing="2">THINK OUTSIDE</text>
    <rect x="0" y="14" width="44" height="3" fill="#D4A373"/>
  </g>

  <g transform="translate(540,560)" text-anchor="middle">
    <text font-size="28" font-weight="500" fill="#D4A373" letter-spacing="6">NOU A INSTAGRAM</text>
    <text y="160" font-size="110" font-weight="700" fill="#54453A">Hola,</text>
    <text y="280" font-size="110" font-weight="700" fill="#54453A">Instagram.</text>
    <text y="380" font-size="26" font-weight="400" fill="#36332F">Som <tspan font-weight="700">Think Outside</tspan> —</text>
    <text y="420" font-size="26" font-weight="400" fill="#36332F">fusters de Terrassa,</text>
    <text y="460" font-size="26" font-weight="400" fill="#36332F">Barcelona.</text>
  </g>

  <g transform="translate(540,1130)">
    <rect x="-150" y="-32" width="300" height="64" rx="32" fill="#D4A373"/>
    <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF">Segueix-nos →</text>
  </g>

  <g transform="translate(60,1290)" font-size="16" font-weight="500" fill="#54453A" letter-spacing="3">
    <text>ESPECIALISTES EN INSTAL·LACIONS I MANTENIMENT DE FUSTERIA</text>
  </g>
</svg>

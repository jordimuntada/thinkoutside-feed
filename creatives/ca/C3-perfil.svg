  </g>

  <g transform="translate(60,300)">
    <text font-size="62" font-weight="700" fill="#54453A">Què busquem</text>
    <text y="76" font-size="62" font-weight="700" fill="#54453A">en tu</text>
  </g>

  <g transform="translate(60,450)">
    <text font-size="24" font-weight="400" fill="#36332F">Persones eficients i amb ofici, que tenen cura dels detalls.</text>
  </g>

  <g transform="translate(60,530)">
    <rect x="0" y="0" width="960" height="112" rx="8" fill="#FFFFFF" stroke="#DED3C4" stroke-width="1"/>

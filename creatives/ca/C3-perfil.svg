    <text x="60" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text>
    <text x="120" y="50" font-size="25" font-weight="700" fill="#54453A">Ofici real</text>
    <text x="120" y="82" font-size="18" font-weight="400" fill="#36332F">Saps treballar la fusta i entens com s'instal·la.</text>
  </g>

  <g transform="translate(60,660)">
    <rect x="0" y="0" width="960" height="112" rx="8" fill="#FFFFFF" stroke="#DED3C4" stroke-width="1"/>
    <circle cx="60" cy="56" r="28" fill="#D4A373"/>
    <text x="60" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text>
    <text x="120" y="50" font-size="25" font-weight="700" fill="#54453A">Eficiència</text>
    <text x="120" y="82" font-size="18" font-weight="400" fill="#36332F">Treballes amb eficàcia i vas més enllà de la teva tasca.</text>
  </g>

  <g transform="translate(60,790)">
    <rect x="0" y="0" width="960" height="112" rx="8" fill="#FFFFFF" stroke="#DED3C4" stroke-width="1"/>
    <circle cx="60" cy="56" r="28" fill="#D4A373"/>
    <text x="60" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">3</text>
    <text x="120" y="50" font-size="25" font-weight="700" fill="#54453A">Criteri</text>
    <text x="120" y="82" font-size="18" font-weight="400" fill="#36332F">Quan alguna cosa no quadra, ho dius i saps com millorar-la.</text>
  </g>

  <g transform="translate(60,920)">
    <rect x="0" y="0" width="960" height="112" rx="8" fill="#FFFFFF" stroke="#DED3C4" stroke-width="1"/>
    <circle cx="60" cy="56" r="28" fill="#D4A373"/>
    <text x="60" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">4</text>
    <text x="120" y="50" font-size="25" font-weight="700" fill="#54453A">Ganes de créixer</text>
    <text x="120" y="82" font-size="18" font-weight="400" fill="#36332F">T'apuntes al que toca, dins i fora del taller.</text>

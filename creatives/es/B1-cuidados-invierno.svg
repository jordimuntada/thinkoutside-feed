<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Raleway, ui-sans-serif, system-ui, sans-serif">
  <rect width="1080" height="1350" fill="#FAF8F3"/>

  <g transform="translate(60,80)">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#54453A" letter-spacing="2">THINK OUTSIDE</text>
    <rect x="0" y="14" width="44" height="3" fill="#D4A373"/>
  </g>

  <g transform="translate(540,260)" text-anchor="middle">
    <text font-size="22" font-weight="600" fill="#D4A373" letter-spacing="6">TIP DE TALLER · INVIERNO</text>
  </g>

  <g transform="translate(60,380)">
    <text font-size="64" font-weight="700" fill="#54453A">Cuida tu parquet</text>
    <text y="76" font-size="64" font-weight="700" fill="#54453A">este invierno.</text>
  </g>

  <g transform="translate(60,580)">
    <g transform="translate(0,0)">
      <circle cx="24" cy="24" r="24" fill="#D4A373"/>
      <text x="24" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
      <text x="72" y="22" font-size="24" font-weight="700" fill="#54453A">Humedad estable</text>
      <text x="72" y="52" font-size="18" font-weight="400" fill="#36332F">Mantén la humedad relativa de la casa entre el</text>
      <text x="72" y="76" font-size="18" font-weight="400" fill="#36332F">40% y el 60%. La calefacción reseca mucho.</text>
    </g>
    <g transform="translate(0,160)">
      <circle cx="24" cy="24" r="24" fill="#D4A373"/>
      <text x="24" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
      <text x="72" y="22" font-size="24" font-weight="700" fill="#54453A">Cuidado con la calefacción</text>
      <text x="72" y="52" font-size="18" font-weight="400" fill="#36332F">No pongas alfombras justo encima de los</text>
      <text x="72" y="76" font-size="18" font-weight="400" fill="#36332F">radiadores. La madera se deforma con el calor.</text>
    </g>
    <g transform="translate(0,320)">
      <circle cx="24" cy="24" r="24" fill="#D4A373"/>
      <text x="24" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
      <text x="72" y="22" font-size="24" font-weight="700" fill="#54453A">Limpieza casi seca</text>
      <text x="72" y="52" font-size="18" font-weight="400" fill="#36332F">Paño húmedo, bien escurrido. Nada de charcos</text>
      <text x="72" y="76" font-size="18" font-weight="400" fill="#36332F">ni productos abrasivos.</text>
    </g>
    <g transform="translate(0,480)">
      <circle cx="24" cy="24" r="24" fill="#D4A373"/>
      <text x="24" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
      <text x="72" y="22" font-size="24" font-weight="700" fill="#54453A">Repaso de barniz</text>
      <text x="72" y="52" font-size="18" font-weight="400" fill="#36332F">Cada 3–5 años, una mano de mantenimiento</text>
      <text x="72" y="76" font-size="18" font-weight="400" fill="#36332F">alarga décadas la vida del suelo.</text>
    </g>
  </g>

  <g transform="translate(60,1180)" text-anchor="middle">
    <rect x="0" y="0" width="960" height="64" rx="32" fill="none" stroke="#54453A" stroke-width="2"/>
    <text x="480" y="42" font-size="18" font-weight="700" fill="#54453A" letter-spacing="2">GUÁRDALO PARA EL FRÍO · PIENSA EN MADERA</text>
  </g>

  <g transform="translate(60,1290)" font-size="16" font-weight="500" fill="#54453A" letter-spacing="3">
    <text>EXPERTOS EN INSTALACIONES Y MANTENIMIENTO DE CARPINTERÍA DE MADERA</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Raleway, ui-sans-serif, system-ui, sans-serif">
  <rect width="1080" height="1350" fill="#FAF8F3"/>

  <g transform="translate(60,80)">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#54453A" letter-spacing="2">THINK OUTSIDE</text>
    <rect x="0" y="14" width="44" height="3" fill="#D4A373"/>
  </g>

  <g transform="translate(540,260)" text-anchor="middle">
    <text font-size="22" font-weight="600" fill="#D4A373" letter-spacing="6">LLISTA DE COMPROVACIÓ</text>
  </g>

  <g transform="translate(60,380)">
    <text font-size="52" font-weight="700" fill="#54453A">5 senyals que indiquen</text>
    <text y="64" font-size="52" font-weight="700" fill="#54453A">que cal revisar la porta.</text>
  </g>

  <g transform="translate(60,560)">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="960" height="84" rx="8" fill="#EFE6DA"/>
      <circle cx="50" cy="42" r="22" fill="#54453A"/>
      <text x="50" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#D4A373">1</text>
      <text x="92" y="50" font-size="22" font-weight="600" fill="#54453A">Frega amb el marc o no encaixa bé</text>
    </g>
    <g transform="translate(0,104)">
      <rect x="0" y="0" width="960" height="84" rx="8" fill="#EFE6DA"/>
      <circle cx="50" cy="42" r="22" fill="#54453A"/>
      <text x="50" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#D4A373">2</text>
      <text x="92" y="50" font-size="22" font-weight="600" fill="#54453A">Frontisses fluixes o que grinyolen</text>
    </g>
    <g transform="translate(0,208)">
      <rect x="0" y="0" width="960" height="84" rx="8" fill="#EFE6DA"/>
      <circle cx="50" cy="42" r="22" fill="#54453A"/>
      <text x="50" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#D4A373">3</text>
      <text x="92" y="50" font-size="22" font-weight="600" fill="#54453A">Fusta inflada per la humitat</text>
    </g>
    <g transform="translate(0,312)">
      <rect x="0" y="0" width="960" height="84" rx="8" fill="#EFE6DA"/>
      <circle cx="50" cy="42" r="22" fill="#54453A"/>
      <text x="50" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#D4A373">4</text>
      <text x="92" y="50" font-size="22" font-weight="600" fill="#54453A">Vernís esquerdat o aixecat</text>
    </g>
    <g transform="translate(0,416)">
      <rect x="0" y="0" width="960" height="84" rx="8" fill="#EFE6DA"/>
      <circle cx="50" cy="42" r="22" fill="#54453A"/>
      <text x="50" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#D4A373">5</text>
      <text x="92" y="50" font-size="22" font-weight="600" fill="#54453A">El pany falla o es mou</text>
    </g>
  </g>

  <g transform="translate(60,1100)" text-anchor="middle">
    <rect x="0" y="0" width="960" height="76" rx="38" fill="#D4A373"/>
    <text x="480" y="50" font-size="22" font-weight="700" fill="#FFFFFF">Et sona alguna? Escriu-nos →</text>
  </g>

  <g transform="translate(60,1290)" font-size="16" font-weight="500" fill="#54453A" letter-spacing="3">
    <text>ESPECIALISTES EN INSTAL·LACIONS I MANTENIMENT DE FUSTERIA</text>
